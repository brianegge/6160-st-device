name: Auto Version

on:
  push:
    branches: [master]
    paths-ignore:
      - 'src/keypad6160/__init__.py'
      - 'pyproject.toml'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest version tag
        id: tag
        run: |
          git fetch --tags
          TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          if [ -z "$TAG" ]; then
            TAG="v1.0.0"
          fi
          echo "current=$TAG" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        run: |
          VERSION="${{ steps.tag.outputs.current }}"
          VERSION="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update version in source files
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" src/keypad6160/__init__.py
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" pyproject.toml

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="${{ steps.bump.outputs.tag }}"
          git add src/keypad6160/__init__.py pyproject.toml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Bump version to ${VERSION}"
          git tag "$TAG"
          git push origin master --tags
